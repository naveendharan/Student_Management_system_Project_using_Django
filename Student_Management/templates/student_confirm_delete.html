<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Student | Student Management System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 35px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fee2e2;
            color: #dc2626;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;

            color: #1f2937;
        }

        .message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 25px;
        }

        .student-info {
            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 8px;

            padding: 15px;

            margin-bottom: 25px;
        }

        .student-name {
            font-size: 18px;
            font-weight: bold;

            color: #1e293b;

            margin-bottom: 5px;
        }

        .student-id {
            font-size: 14px;
            color: #64748b;
        }

        .warning {
            background: #fff7ed;

            border: 1px solid #fed7aa;

            color: #9a3412;

            padding: 12px;

            border-radius: 7px;

            font-size: 13px;

            margin-bottom: 25px;
        }

        .actions {
            display: flex;

            gap: 12px;

            justify-content: center;
        }

        .button {
            border: none;

            padding: 11px 22px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            transition: 0.2s;
        }

        .cancel-button {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-button:hover {
            background: #cbd5e1;
        }

        .delete-button {
            background: #dc2626;
            color: white;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        @media (max-width: 500px) {

            .card {
                padding: 25px 20px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="card">


            <!-- WARNING ICON -->

            <div class="icon">
                ⚠
            </div>


            <!-- TITLE -->

            <h1>
                Delete Student?
            </h1>


            <p class="message">
                Are you sure you want to permanently delete this student?
                This action cannot be undone.
            </p>


            <!-- STUDENT INFORMATION -->

            <div class="student-info">

                <div class="student-name">

                    {{ student.first_name }}
                    {{ student.last_name }}

                </div>

                <div class="student-id">

                    Student ID:
                    {{ student.student_id }}

                </div>

            </div>


            <!-- WARNING -->

            <div class="warning">

                ⚠ This student record will be permanently removed
                from the system.

            </div>


            <!-- ACTIONS -->

            <div class="actions">


                <!-- CANCEL -->

                <a
                    href="{% url 'student_list' %}"
                    class="button cancel-button"
                >
                    Cancel
                </a>


                <!-- DELETE -->

                <form method="POST">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="button delete-button"
                    >
                        Yes, Delete
                    </button>

                </form>


            </div>


        </div>


    </div>


</body>

</html>
